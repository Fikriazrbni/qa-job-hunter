[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-job-hunter-local"
version = "0.1.0"
description = "Personal, deterministic QA job monitoring without AI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qa-job-hunter = "jobhunter.cli:main"

[tool.setuptools.packages.find]
include = ["jobhunter*"]
